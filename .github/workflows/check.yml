name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Committed images match the script
        run: |
          python3 -I docs/tools/render_replies.py
          git diff --exit-code -- docs/assets
      - name: Repo checks
        run: python3 -I docs/tools/check_repo.py
