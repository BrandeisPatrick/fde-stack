<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><title>The agent team</title><desc>An Opus orchestrator above six agents (scout, platform, feature, integrator, reviewer, QA), with the story agent below.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="879" height="371" rx="14" fill="#faf9f5" stroke="#e5e2d8"/><rect x="36" y="28" width="808" height="307.6" rx="10" fill="#ffffff" stroke="#e5e2d8"/><svg x="48" y="40" width="784" height="283.6" viewBox="0 0 680 246" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="14" y="16" width="652" height="56" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="340.0" y="35.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Orchestrator · Opus</text><text x="340.0" y="53.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5f5e5a">plans, briefs, reviews and tracks · writes no product code</text><path d="M340 72 V86" fill="none" stroke="#888780" stroke-width="1.25"/><path d="M64 86 H616" fill="none" stroke="#888780" stroke-width="1.25"/><rect x="14.0" y="102" width="100" height="58" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="64.0" y="122.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Scout</text><text x="64.0" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5f5e5a">maps the code</text><path d="M64.0 86 V98" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="124.4" y="102" width="100" height="58" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="174.4" y="122.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Platform</text><text x="174.4" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5f5e5a">cloud, deploys</text><path d="M174.4 86 V98" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="234.8" y="102" width="100" height="58" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="284.8" y="122.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Feature</text><text x="284.8" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5f5e5a">one per feature</text><path d="M284.8 86 V98" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="345.2" y="102" width="100" height="58" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="395.2" y="122.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Integrator</text><text x="395.2" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5f5e5a">merges, tests</text><path d="M395.2 86 V98" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="455.6" y="102" width="100" height="58" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="505.6" y="122.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Reviewer</text><text x="505.6" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5f5e5a">before deploys</text><path d="M505.6 86 V98" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="566.0" y="102" width="100" height="58" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="616.0" y="122.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">QA</text><text x="616.0" y="140.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5f5e5a">red team, UX</text><path d="M616.0 86 V98" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="14" y="182" width="652" height="50" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="340.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Story</text><text x="340.0" y="216.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5f5e5a">turns the run log and git history into the story page</text></svg></svg>