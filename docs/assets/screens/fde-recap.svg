<svg xmlns="http://www.w3.org/2000/svg" width="880" height="619" viewBox="0 0 880 619" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xml:space="preserve"><title>Example /fde recap reply</title><desc>A synthetic reply cut to a verdict, a table, a diagram and a proposal.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0.5" y="0.5" width="879" height="618" rx="14" fill="#faf9f5" stroke="#e5e2d8"/><rect x="742.1" y="28" width="101.9" height="40" rx="14" fill="#efede6"/><text x="758.1" y="53" font-size="15" fill="#1f1e1b">/fde recap</text><text x="36.0" y="107.0" font-size="15" fill="#1f1e1b"><tspan font-weight="600">Exports fail because the partner only accepts one fixed IP.</tspan></text><rect x="36" y="120" width="573.9" height="144" rx="8" fill="#ffffff" stroke="#e5e2d8"/><path d="M36.5 156 V128 Q36.5 120.5 44 120.5 H601.908 Q609.408 120.5 609.408 128 V156 Z" fill="#f2f0e9"/><text x="49.0" y="143.0" font-size="14" fill="#1f1e1b"><tspan font-weight="600">Date</tspan></text><text x="138.0" y="143.0" font-size="14" fill="#1f1e1b"><tspan font-weight="600">Ran from</tspan></text><text x="310.1" y="143.0" font-size="14" fill="#1f1e1b"><tspan font-weight="600">Result</tspan></text><line x1="36" y1="156" x2="609.9" y2="156" stroke="#e5e2d8"/><text x="49.0" y="179.0" font-size="14" fill="#1f1e1b"><tspan>3/2</tspan></text><text x="138.0" y="179.0" font-size="14" fill="#1f1e1b"><tspan>Cron on the old VM</tspan></text><text x="310.1" y="179.0" font-size="14" fill="#1f1e1b"><tspan>✗ 9 of 12 runs timed out</tspan></text><line x1="36" y1="192" x2="609.9" y2="192" stroke="#e5e2d8"/><text x="49.0" y="215.0" font-size="14" fill="#1f1e1b"><tspan>3/4</tspan></text><text x="138.0" y="215.0" font-size="14" fill="#1f1e1b"><tspan>Cloud Run job</tspan></text><text x="310.1" y="215.0" font-size="14" fill="#1f1e1b"><tspan>✗ ran, then blocked by the partner's allowlist</tspan></text><line x1="36" y1="228" x2="609.9" y2="228" stroke="#e5e2d8"/><text x="49.0" y="251.0" font-size="14" fill="#1f1e1b"><tspan>3/6 to 3/8</tspan></text><text x="138.0" y="251.0" font-size="14" fill="#1f1e1b"><tspan>Partner ticket PT-1042</tspan></text><text x="310.1" y="251.0" font-size="14" fill="#1f1e1b"><tspan>confirmed: one static IP only</tspan></text><text x="36.0" y="299.0" font-size="15" fill="#1f1e1b"><tspan>The weekly export is set up the same way and will hit the same wall.</tspan></text><rect x="36" y="312" width="808" height="240.8" rx="10" fill="#ffffff" stroke="#e5e2d8"/><svg x="48" y="324" width="784" height="216.8" viewBox="0 0 680 188" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="12" y="54" dominant-baseline="central" font-size="13" font-weight="600" fill="#73726c">Today</text><rect x="92" y="24" width="124" height="60" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="154.0" y="54.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Export job</text><path d="M218 54 H234" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="238" y="24" width="124" height="60" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="300.0" y="45.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Changing IP</text><text x="300.0" y="63.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5f5e5a">new one each run</text><path d="M364 54 H380" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="384" y="24" width="124" height="60" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="446.0" y="54.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Partner firewall</text><path d="M510 54 H526" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="530" y="24" width="124" height="60" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="0.75"/><text x="592.0" y="54.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Blocked</text><text x="12" y="134" dominant-baseline="central" font-size="13" font-weight="600" fill="#73726c">Proposed</text><rect x="92" y="104" width="124" height="60" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="154.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Export job</text><path d="M218 134 H234" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="238" y="104" width="124" height="60" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="300.0" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">NAT gateway</text><text x="300.0" y="143.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#5f5e5a">one static IP</text><path d="M364 134 H380" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="384" y="104" width="124" height="60" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="446.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Partner firewall</text><path d="M510 134 H526" fill="none" stroke="#888780" stroke-width="1.25" marker-end="url(#ah)"/><rect x="530" y="104" width="124" height="60" rx="8" fill="#f1efe8" stroke="#b4b2a9" stroke-width="0.75"/><text x="592.0" y="134.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Delivered</text></svg><text x="36.0" y="587.8" font-size="15" fill="#1f1e1b"><tspan font-weight="600">Proposal:</tspan><tspan> route both jobs through a NAT gateway with one static IP, and send it to the partner.</tspan></text></svg>